name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check host entry
        run: node --check index.js

      - name: Syntax check client entry
        run: node --check client.js

      - name: Repository self-check
        run: node test/check.mjs
